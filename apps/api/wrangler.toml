name = "store-manager-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "wj.160847.xyz", custom_domain = true },
  { pattern = "origin.160847.xyz", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "store-manager-db"
database_id = "3660ef43-bf5c-4ac2-8870-7d3346792e4c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "store-manager-files"

[assets]
directory = "../miniapp/dist-h5"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

# 硅基流动：账号级 Secrets Store（secret_name=siliconflow-key）绑定到 Worker。
# 需在 dashboard 复制 store_id 后取消注释并 deploy。
# 也可用常规 secret 兜底：bunx wrangler secret put SILICONFLOW_KEY
# [[secrets_store_secrets]]
# binding = "SILICONFLOW_KEY_STORE"
# store_id = "<SECRETS_STORE_ID>"
# secret_name = "siliconflow-key"

# 智谱 glm-ocr（推荐中文表格，约 0.2 元/M tokens）：
# bunx wrangler secret put ZHIPU_API_KEY
# 可选：bunx wrangler secret put ZHIPU_OCR_MODEL  # 默认 glm-ocr

[triggers]
crons = ["0 18 * * *"]
