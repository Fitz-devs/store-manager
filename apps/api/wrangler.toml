name = "store-manager-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "wj.160847.xyz", custom_domain = true },
  { pattern = "origin.160847.xyz", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "store-manager-db"
database_id = "3660ef43-bf5c-4ac2-8870-7d3346792e4c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "store-manager-files"

[assets]
directory = "../miniapp/dist-h5"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[triggers]
crons = ["0 18 * * *"]
