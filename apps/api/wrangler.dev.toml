name = "store-manager-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "development"
OCR_MOCK = "1"
JWT_SECRET = "dev-only-jwt-secret-not-for-prod"
# 本地测硅基流动：OCR_MOCK 改为 "0"，并在 .dev.vars 写入 SILICONFLOW_KEY=sk-...

[[d1_databases]]
binding = "DB"
database_name = "store-manager-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "store-manager-files"

[triggers]
crons = ["0 18 * * *"]
